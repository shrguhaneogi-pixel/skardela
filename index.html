<!doctype html>
<html lang="en">
  <head>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="7ce42533-1688-4a51-9438-41cb377759e8"
    ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Skardela: free daily puzzles of new types. No account, no download."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#c2410c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Skardela</title>
    <!-- This sets the saved theme before the page shows, so the page does not flash. It must use the same key and values as "src/shared/theme.ts". -->
    <script>
      try {
        var theme = localStorage.getItem("skardela-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>Skardela needs JavaScript. Turn on JavaScript to play.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
